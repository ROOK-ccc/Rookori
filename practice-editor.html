<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>一般練習問題の編集 | Rookori</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="editor.css">
  <script defer src="vendor/chess.js"></script>
  <script defer src="game-study.js"></script>
  <script defer src="practice-explanation.js"></script>
  <script defer src="practice-editor-validate.js"></script>
  <script defer src="editor-local.js"></script>
  <script defer src="practice-editor.js"></script>
</head>
<body>
<main class="shell editor">
  <h1>一般練習問題の編集</h1>
  <nav class="editor-row" aria-label="教材編集ツール"><a class="button secondary" href="opening-editor.html">オープニング教材エディターへ</a></nav>
  <div class="editor-row">
    <label>問題ID・問題名 <input id="puzzle-search" type="search"></label>
    <label><input id="puzzle-unwritten" type="checkbox"> 個別解説が未入力の問題のみ</label>
    <label>解説の確認状態 <select id="puzzle-filter"><option value="">すべて</option><option value="generated">自動生成</option><option value="reviewed">確認済み</option><option value="authored">独自執筆</option></select></label>
    <label>対象 <select id="puzzle-choice"></select></label>
  </div>
  <p id="puzzle-status" role="status"></p>
  <div class="editor-grid" id="puzzle-workspace" hidden>
    <form id="puzzle-edit" class="editor-card editor-fields">
      <label>問題名<input name="title"></label><label>問題レート<input name="rating" type="number" min="400" max="3000"></label>
      <label class="editor-wide">FEN（出題する盤面）<textarea name="fen"></textarea></label>
      <label class="editor-wide">正解手順（例 e2e4 e7e5 g1f3）<textarea name="moves"></textarea></label>
      <label class="editor-wide">別解（別の初手ごとに1行）<textarea name="alternatives"></textarea></label>
      <label class="editor-wide">テーマ（空白で区切る）<input name="tags"></label>
      <label class="editor-wide">問題文<textarea name="prompt"></textarea></label>
      <label class="editor-wide">ヒント<textarea name="hint"></textarea></label>
      <label class="editor-wide">日本語の個別解説<textarea name="explanation"></textarea></label>
      <label class="editor-wide">確認状態 <select name="explanationStatus"><option value="generated">自動生成</option><option value="reviewed">確認済み</option><option value="authored">独自執筆</option></select></label>
      <label class="editor-wide">出典<textarea name="source"></textarea></label>
      <label class="editor-wide"><input type="checkbox" name="published"> 検証済みファイルを反映したときに公開する</label>
    </form>
    <section class="editor-card" aria-labelledby="puzzle-preview-title">
      <h2 id="puzzle-preview-title">プレビュー</h2>
      <div id="puzzle-board" class="study-board editor-board" role="img" aria-label="問題の盤面"></div>
      <label>再生する手順 <select id="puzzle-line"></select></label>
      <div class="editor-row"><button class="button secondary" id="puzzle-prev">一手戻る</button><button class="button secondary" id="puzzle-next">一手進む</button></div>
      <p id="puzzle-moves" role="status"></p>
      <div id="puzzle-facts"></div>
      <h3>編集前後の差分</h3><ul id="puzzle-diff"></ul>
    </section>
    <div class="editor-row">
      <button class="button secondary" id="puzzle-draft">下書きを保存</button>
      <button class="button secondary" id="puzzle-check">合法手を検証して盤を更新</button>
      <button class="button primary" id="puzzle-apply">作業フォルダーに反映</button>
      <button class="button secondary" id="puzzle-export">変更ファイルをダウンロード</button>
    </div>
  </div>
</main>
</body>
</html>
